name: Update PSX Daily Data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5' # 18:30 Pakistan time
permissions:
  contents: write
jobs:
  update:
    if: vars.PSX_PROVIDER_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update market data
        run: python scripts/update_data.py
      - name: Commit validated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/status.json
          git diff --cached --quiet || (git commit -m 'Update validated PSX dataset' && git push)
